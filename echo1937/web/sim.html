<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回声 1937 · 城市模拟</title>
<style>
  :root { --paper: #f4ede0; --card: #fffaf1; --ink: #23202a; --muted: #847a6c; --line: #e2d6c2; --gold: #b8892f; --gold-soft: #f1e2bf; --night: #232945; --bad: #b4473c; --mint: #6fa892; --you: #3d5a99; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; }
  header { background: var(--night); color: #f4e4bf; padding: 12px 16px; border-bottom: 3px double var(--gold); display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font: 600 20px/1.2 Georgia, "Songti SC", serif; letter-spacing: .12em; }
  header p { margin: 0; font-size: 12px; color: #c9bb98; }
  header a { color: #f4e4bf; font-size: 12px; margin-left: auto; }
  main { max-width: 1280px; margin: 0 auto; padding: 14px 16px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  h2 { font: 600 16px/1.3 Georgia, "Songti SC", serif; margin: 0 0 8px; }
  h3 { font-size: 13px; margin: 10px 0 4px; color: var(--muted); font-weight: 600; }
  button, select, input { font: inherit; }
  button { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--night); color: #f4e4bf; border-color: var(--night); }
  button.take { background: var(--you); color: #fff; border-color: var(--you); }
  input, select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: #fff; }
  input[type=number] { width: 80px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 8px; }
  label.f { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .clock { font: 600 18px/1.3 Georgia, "Songti SC", serif; }
  .muted { color: var(--muted); font-size: 12px; }
  #log { max-height: 70vh; overflow: auto; }
  .slot { font-weight: 600; margin: 12px 0 4px; padding-bottom: 2px; border-bottom: 1px dashed var(--line); color: var(--night); }
  .e { padding: 3px 0 3px 10px; border-left: 3px solid transparent; }
  .e.card, .e.choice { border-left-color: var(--gold); background: #fbf3e2; margin: 4px 0; padding: 6px 10px; border-radius: 0 8px 8px 0; }
  .e.move { color: var(--muted); }
  .e.day, .e.system { color: var(--night); font-weight: 600; }
  .e.you { border-left-color: var(--you); }
  .e .t { font-weight: 600; margin-right: 4px; }
  .chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--gold-soft); margin: 0 2px; white-space: nowrap; }
  .chip.bad { background: #f3d6d1; color: var(--bad); }
  .chip.good { background: #d8ebe3; color: #2f6b55; }
  .chip.you { background: var(--you); color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; }
  .bar { height: 6px; background: #eee3cf; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--mint); }
  .bar.low i { background: var(--bad); }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 1px 0; }
  .q.done { color: var(--muted); text-decoration: line-through; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button { text-align: left; font-size: 13px; }
  .opts button small { color: var(--muted); margin-left: 4px; }
  button.small { padding: 3px 9px; font-size: 13px; }
  .pending { border: 2px solid var(--gold); }
  .pending .opts button { font-size: 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; }
  .scores { font-size: 12px; color: var(--muted); }
  .strip { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
  .strip figure { margin: 0; width: 180px; }
  .strip img { cursor: zoom-in; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .strip figcaption { font-size: 11px; color: var(--muted); }
  .now img { cursor: zoom-in; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; margin-bottom: 8px; }
  .e img.panel { display: block; max-width: min(560px, 100%); max-height: 420px; width: auto; border-radius: 6px; border: 1px solid var(--line); margin: 6px 0 2px; cursor: zoom-in; }
  .e .ph { display: block; max-width: 560px; aspect-ratio: 3 / 2; border-radius: 6px; border: 1px dashed var(--line); margin: 6px 0 2px;
    background: repeating-linear-gradient(45deg, #f6eddd, #f6eddd 10px, #fbf5ea 10px, #fbf5ea 20px); color: var(--muted); font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .e .err { color: var(--bad); font-size: 12px; }
  button.draw { padding: 0 7px; font-size: 11px; border-radius: 9px; margin-left: 4px; color: var(--muted); }
  #artinfo { font-size: 12px; color: var(--muted); }
  #zoom { position: fixed; inset: 0; background: rgba(20, 18, 30, .85); display: flex; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
  #zoom img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
  .stage-wrap { text-align: center; }
  .stage-frame { position: relative; line-height: 0; display: inline-block; max-width: 100%; }
  .stage-frame > img { max-width: 100%; min-width: 300px; max-height: 72vh; width: auto; height: auto; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
  .stage-frame > .stage-empty { width: min(560px, 80vw); }
  .stage-empty { aspect-ratio: 3 / 2; border-radius: 8px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; line-height: 1.6;
    background: repeating-linear-gradient(45deg, #f6eddd, #f6eddd 10px, #fbf5ea 10px, #fbf5ea 20px); }
  .hs { position: absolute; border: 2px dashed rgba(244, 228, 191, .35); border-radius: 6px; cursor: pointer; }
  .hs:hover, .hs.open { border-color: #f4e4bf; background: rgba(244, 228, 191, .14); }
  /* 标签单独一层，压在所有框上面：框常常互相重叠，标签总能点到 */
  .hl { position: absolute; z-index: 2; transform: translate(-50%, -50%); background: rgba(35, 41, 69, .9); color: #f4e4bf; font-size: 12px; line-height: 1.5; padding: 2px 9px; border-radius: 10px; white-space: nowrap; cursor: pointer; }
  .hl:hover, .hl.open { background: var(--gold); color: #fff; }
  .hl.off { background: rgba(90, 90, 90, .78); color: #e6e6e6; }
  .hl.pulse { animation: pulse .5s ease-in-out 3; background: var(--gold); color: #fff; }
  .pop { position: absolute; z-index: 3; background: var(--card); border: 1px solid var(--gold); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 170px; line-height: 1.5; box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
  .pop.inline { position: static; display: inline-flex; margin-top: 6px; }
  .pop button { text-align: left; font-size: 13px; }
  .pop small { color: var(--muted); display: block; font-size: 11px; }
  .chips { margin-top: 8px; font-size: 13px; }
  .chips button { padding: 2px 10px; font-size: 13px; border-radius: 12px; }
  .hs.exit { border-color: rgba(244, 228, 191, .55); }
  .hl.exit { background: rgba(184, 137, 47, .94); color: #fff; }
  .hs.pulse { animation: pulse .5s ease-in-out 3; border-color: #fff; background: rgba(255, 255, 255, .22); }
  @keyframes pulse { 50% { transform: scale(1.04); box-shadow: 0 0 0 4px rgba(244, 228, 191, .7); } }
  .stage-cap { margin-top: 6px; font-size: 13px; color: var(--night); font-weight: 600; min-height: 1.4em; }
  #mapbox { position: fixed; inset: 0; background: rgba(20, 18, 30, .6); z-index: 8; display: flex; align-items: center; justify-content: center; padding: 12px; }
  #mapbox[hidden] { display: none; }
  #mapbox .sheet { background: var(--card); border-radius: 12px; border: 1px solid var(--gold); width: min(920px, 100%); max-height: 96vh; overflow: auto; padding: 14px; }
  #mapbox svg { width: 100%; max-height: 62vh; display: block; border-radius: 8px; }
  #mapbox .pin { cursor: pointer; }
  #mapbox .pin:hover circle.dot { stroke: var(--gold); stroke-width: .6; }
  .plan { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 8px; }
  .plan span { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #f1e8d6; color: var(--muted); }
  .plan span.now { background: var(--night); color: #f4e4bf; }
  .plan span.done { text-decoration: line-through; }
  .mapdetail { margin-top: 8px; }
  .mapdetail .opts button { font-size: 14px; }
  @keyframes dash { to { stroke-dashoffset: -6; } }
  .route { animation: dash .6s linear infinite; }
  #notices { position: fixed; right: 12px; bottom: 12px; z-index: 20; display: flex; flex-direction: column; gap: 6px; max-width: min(420px, 92vw); }
  .notice { background: var(--night); color: #f4e4bf; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
  .notice.bad { background: var(--bad); color: #fff; }
  .note { font-size: 12px; color: var(--muted); background: #fbf3e2; border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; }
</style>
</head>
<body>
<header>
  <h1>回声 1937 · 城市模拟</h1>
  <p>第二版底层（M1–M2）的文字测试页：她自己过日子，你随时接管。规则见 docs/sim-design.md。</p>
  <a href="index.html">回到漫画版</a>
</header>
<main>
  <div>
    <div class="card">
      <div class="row">
        <label class="f">种子 <input id="seed" type="number" value="1" min="1"></label>
        <label class="f">身份 <select id="role"><option value="singer">歌手</option><option value="makeup">化妆师</option><option value="reporter">记者</option></select></label>
        <label class="f">分身遇到抉择 <select id="mode">
          <option value="auto">全部自己选</option><option value="major">大事问我</option><option value="ask">每次都问我</option></select></label>
        <button id="new" class="primary">新开一局</button>
        <button id="rand">随机种子</button>
      </div>
      <div class="row">
        <button id="step">下一步</button>
        <button id="slot">过完这个时段</button>
        <button id="day">过完今天</button>
        <button id="day2">再跑两天</button>
        <button id="take" class="take">接管</button>
      </div>
      <div class="row">
        <button id="play" class="primary">▶ 自动播放</button>
        <label class="f">速度 <select id="speed"><option value="600">快</option><option value="1200" selected>正常</option><option value="2200">慢</option></select></label>
        <label class="f"><input type="checkbox" id="waitArt" checked> 等这一格画好再走</label>
        <span class="muted" id="status"></span>
      </div>
    </div>
    <div class="card" id="stage"></div>
    <div class="card">
      <div class="row">
        <label class="f">配图 <select id="artEngine">
          <option value="fuse">拼接 + klein 融合（约 2–3 秒，约 $0.01 一格）</option>
          <option value="stitch">只拼接（0.1 秒，不花钱）</option>
          <option value="gemini">Gemini 从头画（约 10 秒，约 $0.04 一格）</option></select></label>
        <label class="f">自动画 <select id="artAuto">
          <option value="major">只画大事（故事卡、抉择）</option><option value="slot">大事 + 每个时段一格（约每天 6–8 张）</option><option value="every">每一步都画（约每天 15–20 张）</option><option value="off">不自动画，点「画」才画</option></select></label>
        <button id="artBack" class="small">补画这一局的大事</button>
      </div>
      <div id="artinfo" style="margin-top:6px"></div>
    </div>
    <div class="card pending" id="pending" hidden></div>
    <div class="card" id="menu" hidden></div>
    <div class="card"><h2>她的一天</h2><div id="log"></div></div>
    <div class="card">
      <h2>批量统计</h2>
      <div class="row">
        <label class="f">局数 <input id="bn" type="number" value="30" min="1" max="500"></label>
        <label class="f">天数 <input id="bd" type="number" value="7" min="1" max="14"></label>
        <button id="batch">跑三种身份</button>
        <span class="muted">大事全部由分身自己选；用来看数值和卡的触发率</span>
      </div>
      <div id="bout"></div>
    </div>
  </div>
  <div>
    <div class="card" id="side"></div>
  </div>
</main>
<div id="mapbox" hidden></div>
<div id="notices"></div>
<script src="world.js"></script>
<script src="core.js"></script>
<script src="engine.js"></script>
<script src="fuse.js"></script>
<script src="sim_data.js"></script>
<script src="story.js"></script>
<script src="sim.js"></script>
<script src="sim_art.js"></script>
<script src="sim_fuse.js"></script>
<script>
"use strict";
// 这一页的代码包在一个函数里：core.js、engine.js 里有同名的 $、esc、S、render 等全局名字
(() => {
const D = Sim.makeData(window.SIM, window.WORLD, window.STORY), S = D.sim;
window.D = D;  // sim_art.js、sim_fuse.js 用
Object.defineProperty(window, "st", {get: () => st, configurable: true});  // 方便在控制台里看
window.SIMDBG = {renderStage: () => renderStage(), pulse: id => { stagePulse = id; renderStage(); }};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const KEY = "echo1937.sim";
let st = null;

const ROLE = {singer: "歌手", makeup: "化妆师", reporter: "记者"};
const STAT = {money: "钱", energy: "体力", mood: "心情", social: "社交", fame: "名气", heat: "嫌疑"};
const placeName = (p, sub) => (D.world_places[p] || p) + (sub ? "·" + S.places[p].subs[sub].label : "");
const label = id => (D.items[id] && D.items[id].label) || id;

// ---------- 场景底图 ----------
// 漫画版主页（index.html）生成的场景底图存在同一个浏览器的 IndexedDB（echo1937 / kv，键 blob:scene:<地点>:<光线>）里。
// 这里只读不写；没有底图时只显示文字。漫画分镜要到 M4 才接进来。
const IMG = {urls: {}};
async function loadScenes() {
  try {
    const db = await new Promise((ok, no) => {
      const r = indexedDB.open("echo1937", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
    });
    const os = () => db.transaction("kv").objectStore("kv");
    const keys = await new Promise(ok => { const r = os().getAllKeys(); r.onsuccess = () => ok(r.result || []); r.onerror = () => ok([]); });
    for (const k of keys.filter(k => String(k).startsWith("blob:scene:"))) {
      const blob = await new Promise(ok => { const r = os().get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); });
      if (blob instanceof Blob) IMG.urls[k.slice(11)] = URL.createObjectURL(blob);
    }
  } catch (e) {}
}
// 某个地点在某个时段用哪张底图：先按 sim.json 的 lights 取，没有就用这个地点已有的任意一张
function sceneUrl(place, slot) {
  const want = (S.places[place].lights || {})[slot], all = ((D.world.places.find(p => p.id === place) || {}).lights) || [];
  for (const l of [want, ...all]) if (l && IMG.urls[place + ":" + l]) return IMG.urls[place + ":" + l];
  return null;
}
const haveScenes = () => Object.keys(IMG.urls).length > 0;

function newGame() {
  stopPlay(); closeMap();
  if (st) Art.dropGame(st);
  st = Sim.newGame(D, {seed: +$("seed").value || 1, role: $("role").value, decisionMode: $("mode").value});
  st.gid = Date.now().toString(36); st.imgs = {}; st.artSeen = 0;
  Art.gid = st.gid;
  render();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s && s.v === 1 && s.log) { st = s; $("seed").value = s.seed; $("role").value = s.role; $("mode").value = s.decisionMode; return true; }
  } catch (e) {}
  return false;
}

// ---------- 推进 ----------
function blocked() { return st.ended || st.control === "player" || (st.pending && !Story.canAutoChoose(st, D)); }
function run(stop) {
  let guard = 0;
  while (!blocked() && guard++ < 600) { Sim.auto(st, D); if (stop(st)) break; }
  render();
}
$("step").onclick = () => { const n = st.log.length; run(s => s.log.length > n && s.log[s.log.length - 1].kind !== "time"); };
$("slot").onclick = () => { const d = st.day, sl = st.slot; run(s => s.day !== d || s.slot !== sl); };
$("day").onclick = () => { const d = st.day; run(s => s.day !== d); };
$("day2").onclick = () => { const d = st.day; run(s => s.day >= d + 2); };
$("new").onclick = newGame;
$("rand").onclick = () => { $("seed").value = 1 + Math.floor(Math.random() * 99999); newGame(); };
$("mode").onchange = () => { if (st) { st.decisionMode = $("mode").value; render(); } };
$("take").onclick = () => { stopPlay(); st.control = st.control === "player" ? "auto" : "player"; render(); };

// ---------- 渲染 ----------
function render() {
  // 新出现的日志按「自动画」的设置排队配图
  Art.auto(st, st.artSeen || 0); st.artSeen = st.seq;
  save();
  const sl = Sim.slotOf(st, D);
  $("take").textContent = st.control === "player" ? "交还给她" : "接管";
  for (const b of ["step", "slot", "day", "day2"]) $(b).disabled = blocked() || playing;
  $("status").textContent = st.ended ? "本局结束" : st.control === "player" ? "你在操作她（点「自动播放」交还给她）" : st.pending && !Story.canAutoChoose(st, D) ? "等你做决定" : playing ? "她在过自己的一天…" : "";
  renderPending(); renderMenu(); renderStage(); renderLog(); renderSide(sl); renderArt();
}

// ---------- 舞台：此刻的画面，上面能点的东西 ----------
// 点画面上的标签就接管她去做这件事；画面里没找到的东西列在下面
let stagePop = null, stagePulse = null, stageCaption = "";
const SCENE_HOT = {};
function stageView() {
  const sl = Sim.slotOf(st, D).id;
  const e = [...st.log].reverse().find(x => x.day === st.day && x.slot === sl && x.place === st.place && (x.sub || null) === st.sub && Art.urls[x.n]);
  const drawing = st.log.some(x => x.day === st.day && x.slot === sl && Art.jobs[x.n] && (Art.jobs[x.n].state === "drawing" || Art.jobs[x.n].state === "queued"));
  if (e) {
    const j = Art.jobs[e.n] || {};
    return {url: Art.urls[e.n], hot: (st.hot || {})[e.n] || null, detecting: !!j.detecting, drawing, cap: "此刻：" + (e.title || e.text.slice(0, 36))};
  }
  const url = st.sub ? null : sceneUrl(st.place, sl), k = st.place + ":" + sl;
  if (url && SCENE_HOT[k] === undefined) { SCENE_HOT[k] = "loading"; Art.sceneHot(st.place, sl).then(v => { SCENE_HOT[k] = v || null; renderStage(); }).catch(() => { SCENE_HOT[k] = null; }); }
  return {url, hot: Array.isArray(SCENE_HOT[k]) ? SCENE_HOT[k] : null, detecting: SCENE_HOT[k] === "loading", drawing, cap: url ? "底图（还没画人）" : ""};
}
function hotActions(h) {
  const opts = Sim.options(st, D), P = D.sim.places[st.place];
  return h.actions.map(a => {
    // a 的写法：动作 id；sub:<小地点>；person:<动作>:<人物>
    const sub = a.startsWith("sub:") ? a.slice(4) : null, person = a.startsWith("person:") ? a.split(":") : null;
    const o = sub || person ? opts.find(x => x.key === a) : opts.find(x => x.id === a && x.kind === "place");
    const label = sub ? `去${P.subs[sub].label}` : person ? `${(D.sim.actions[person[1]] || {}).label || person[1]}（${D.names[person[2]] || person[2]}）` : (D.sim.actions[a] || {}).label || a;
    const why = o ? "" : st.pending ? "先做完眼前的决定" : sub ? "现在去不了" : person ? (Sim.presentAt(st, D).includes(person[2]) ? (Sim.blockReason(st, D, person[1]) || "现在做不了") : `${D.names[person[2]]}不在`) : Sim.blockReason(st, D, a) || "现在做不了";
    return {a, o, label, why};
  });
}
function popHtml(h, cls, style) {
  return `<div class="pop ${cls}" style="${style}">${hotActions(h).map((x, i) => x.o
    ? `<button data-hact="${esc(h.id)}:${i}">${esc(x.label)}${x.o.odds != null ? ` <small>成功率 ${x.o.odds}%</small>` : ""}</button>`

}
function renderStage() {
  const box = $("stage"), v = stageView(), list = Art.hotspotsFor(st.place, st.sub, Sim.presentAt(st, D));

  h += v.url ? `<img src="${v.url}" alt="">` : `<div class="stage-empty">${v.drawing ? "正在画…" : st.sub ? "这里还没有画面：做点什么就会画出来" : "还没有画面"}</div>`;
  // 大框在下、小框在上；标签放在框中心，挨得太近时往下挪一点

    const tip = esc(acts.map(a => a.label + (a.o ? "" : "（" + a.why + "）")).join(" / "));

  // 图下面把这里能点的东西全列出来：图上找没找到都能点，不用在画面里找
  if (list.length) {
    h += `<div class="chips">在这里可以：${list.map(m => `<button data-hs="${esc(m.id)}"${stagePulse === m.id ? ' class="primary"' : ""}${found.some(f => f.id === m.id) ? "" : ' title="画面里没找到，也能直接点"'}>${esc(m.label)}</button>`).join(" ")}${v.detecting ? ` <span class="muted">正在找画面里的位置…</span>` : ""}</div>`;
    const m = missing.find(x => x.id === stagePop);

  }
  h += `<div class="muted" style="margin-top:6px">${esc(v.cap)}${v.drawing ? " · 下一格正在画…" : ""}${v.detecting && found.length === 0 && !missing.length ? " · 正在找能点的东西…" : ""}${list.length ? "" : " · 这个地点还没配可点的东西（目前只做了公寓、卫生间和餐厅）"}</div>`;
  box.innerHTML = h;
}
$("stage").onclick = ev => {

// ---------- 自动播放 ----------
// 一步一步演：她要去别处就打开地图标出路线，要做这里的事就让画面上对应的标签闪一下，然后再做；可以等这一格画好再走
let playing = false, playTimer = 0, resumeAfterChoice = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
const speed = () => +$("speed").value || 1200;
function startPlay() {
  if (st.ended) return;
  st.control = "auto"; playing = true; resumeAfterChoice = false;
  $("play").textContent = "⏸ 暂停"; render(); playStep();
}
function stopPlay() {
  if (!playing) return;
  playing = false; clearTimeout(playTimer);
  $("play").textContent = "▶ 自动播放";
  stagePulse = null; stageCaption = "";
  if (mapState && mapState.mode === "watch") closeMap();
}
$("play").onclick = () => { if (playing) { stopPlay(); render(); } else startPlay(); };
function hotspotOf(pick) {
  const list = Art.hotspotsFor(st.place, st.sub, Sim.presentAt(st, D));
  const keys = [pick.key, pick.id, pick.kind === "sub" ? "sub:" + pick.sub : null].filter(Boolean);
  const h = list.find(x => x.actions.some(a => keys.includes(a)));
  return h ? h.id : null;
}
async function waitArt(from) {
  const t0 = Date.now();
  while (playing && Date.now() - t0 < 45000) {
    const busy = st.log.some(e => e.n > from && Art.jobs[e.n] && (Art.jobs[e.n].state === "queued" || Art.jobs[e.n].state === "drawing"));
    if (!busy) return;
    await wait(300);
  }
}
async function playStep() {
  if (!playing) return;
  if (st.ended || st.control === "player") { stopPlay(); render(); return; }
  const from = st.seq;
  if (st.pending) {
    if (!Story.canAutoChoose(st, D)) { stopPlay(); resumeAfterChoice = true; render(); return; }
    stageCaption = `她在想：${st.pending.question}`; renderStage(); await wait(speed());
    if (!playing) return;
    Story.autoChoose(st, D);
  } else {
    const pick = Sim.decide(st, D);
    if (!pick) Sim.advance(st, D, 1);
    else {
      if (pick.kind === "go") { openMap("watch", pick); await wait(speed() * 1.6); }
      else {
        stagePulse = hotspotOf(pick); stageCaption = `她选择：${pick.label}`; renderStage();
        await wait(speed());
      }
      if (!playing) return;
      Sim.actAuto(st, D, pick);
      if (mapState && mapState.mode === "watch") closeMap();
    }
  }
  stagePulse = null; stageCaption = "";
  render();
  if ($("waitArt").checked) await waitArt(from);
  if (playing) playTimer = setTimeout(playStep, 200);
}

function artHtml(e) {
  if (Art.urls[e.n]) {

    let tt = "";
    if (t && t.stitch != null) {
      // 拼接图多久出来；融合在后台，每次重绘多久（上传 / 等模型 / 下载），检查有没有通过
      const made = t.made && t.made.length ? "（新生成：" + esc(t.made.join("、")) + "）" : "";
      tt = `拼接图 ${sec(t.assets + t.stitch)} 秒出来：准备素材 ${sec(t.assets)} 秒${made} · 拼接 ${sec(t.stitch)} 秒`;
      if (t.fusing) tt += ` · <b>正在后台融合…</b>（先显示拼接图）`;
      else if (t.attempts) {
        const parts = t.attempts.map((x, i) => `第 ${i + 1} 次 klein ${sec(x.ms)} 秒${x.up != null ? `（上传 ${sec(x.up)}、等模型 ${sec(x.wait)}${x.model != null ? "，其中纯模型 " + sec(x.model) : ""}、下载 ${sec(x.down)}）` : ""}${x.pass === false ? `<span class="err">没通过：${esc(x.why)}</span>` : x.pass ? "通过" : ""}`);
        tt += ` · 后台融合 ${sec(t.fuse)} 秒：${parts.join("；") || "—"}${t.review ? ` · 识别检查 ${sec(t.review)} 秒` : ""} · ${t.mode === "fuse" ? "已换成融合图" : `<span class="err">没通过，保留拼接图</span>`}`;
      }
      if (t.note && !t.attempts) tt += ` · <span class="err">${esc(t.note)}</span>`;
    }
    else if (t) tt = `Gemini 共 ${sec(t.total)} 秒：等画面描述 ${sec(t.desc)} 秒 · 准备参考图 ${sec(t.prep)} 秒 · 生图请求 ${sec(t.call)} 秒`;
    if (tt) tt = `<span class="muted" style="font-size:11px;display:block">${tt}</span>`;
    return `<img class="panel" src="${Art.urls[e.n]}" alt="">${tt}`;
  }
  const j = Art.jobs[e.n];

}

  const btns = arr => `<div class="opts">${arr.map(([o, i]) => `<button data-i="${i}">${optLabel(o)}</button>`).join("")}</div>`;
  box.innerHTML = `<h2>你来决定 · ${esc(placeName(st.place, st.sub))}</h2>` +
    (groups.here.length ? `<h3>在这里</h3>${btns(groups.here)}` : "") +
    (groups.people.length ? `<h3>找人</h3>${btns(groups.people)}` : "") +
    (groups.go.length ? `<h3>出门</h3>${btns(groups.go)}` : "") +
    `<div class="row" style="margin-top:10px"><button id="letHer">这一步让她自己来</button></div>`;
  box.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { Sim.act(st, D, opts[+b.dataset.i], "player"); render(); });
  $("letHer").onclick = () => { st.control = "auto"; Sim.auto(st, D); st.control = "player"; render(); };
}

function deltaChips(d) {
  if (!d) return "";
  const out = [];
  for (const [k, v] of Object.entries(d)) {
    if (STAT[k] && v) out.push(`<span class="chip ${(k === "heat" ? v > 0 : v < 0) ? "bad" : "good"}">${STAT[k]} ${v > 0 ? "+" : ""}${Math.round(v * 100) / 100}</span>`);
    else if (k === "rel") for (const [who, r] of Object.entries(v)) {
      const t = [r.a ? `好感${r.a > 0 ? "+" : ""}${r.a}` : "", r.t ? `信任${r.t > 0 ? "+" : ""}${r.t}` : ""].filter(Boolean).join(" ");
      if (t) out.push(`<span class="chip">${esc(D.names[who] || who)} ${t}</span>`);
    } else if ((k === "items" || k === "clues") && v.length) out.push(...v.map(x => `<span class="chip good">${x[0] === "-" ? "失去" : "得到"}：${esc(label(x.replace(/^-/, "")))}</span>`));
    else if (k === "notes") out.push(...v.map(x => `<span class="chip">${esc(x)}</span>`));
    else if (k === "levelUp") out.push(...v.map(x => `<span class="chip good">${esc(typeof x === "string" ? x : JSON.stringify(x))}</span>`));
  }
  return out.join("");
}
function renderLog() {
  let html = "", last = "";
  // 每个时段她到过的地方（按先后），用来在时段标题下排一行底图
  const visited = {};
  for (const e of st.log) {
    if (e.kind === "time" || e.kind === "day") continue;
    const k = e.day + ":" + e.slot, v = visited[k] = visited[k] || [];
    if (!v.includes(e.place)) v.push(e.place);
  }
  for (const e of st.log) {
    if (e.kind === "time" || e.kind === "day") continue;
    const k = e.day + ":" + e.slot;
    if (k !== last) {
      last = k; html += `<div class="slot">第 ${e.day} 天 · ${esc(e.slotLabel)}</div>`;
      // 这个时段已经有配图的话就不再排场景底图
      const drawn = st.log.some(x => x.day === e.day && x.slot === e.slot && Art.urls[x.n]);
      const figs = drawn ? [] : visited[k].map(p => [p, sceneUrl(p, e.slot)]).filter(x => x[1]);
      if (figs.length) html += `<div class="strip">${figs.map(([p, u]) => `<figure><img src="${u}" alt=""><figcaption>底图 · ${esc(D.world_places[p] || p)}（还没画人）</figcaption></figure>`).join("")}</div>`;
    }
    const oc = e.outcome ? `<span class="chip ${e.outcome === "fail" ? "bad" : e.outcome === "success" ? "good" : ""}">${{success: "成功", partial: "勉强", fail: "失败"}[e.outcome] || e.outcome}${e.odds != null ? " " + e.odds + "%" : ""}</span>` : "";
    const you = e.who === "player" ? `<span class="chip you">接管</span>` : "";
    const art = artHtml(e), canDraw = !art && ["card", "choice", "action"].includes(e.kind);
    html += `<div class="e ${esc(e.kind)}${e.who === "player" ? " you" : ""}">${art}${you}${e.title ? `<span class="t">${esc(e.title)}</span>` : ""}${esc(e.text)} ${oc}${deltaChips(e.delta)}${canDraw ? `<button class="draw" data-draw="${e.n}">画</button>` : ""}</div>`;
  }
  const box = $("log"), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = html;
  if (atEnd) box.scrollTop = box.scrollHeight;
}

function bar(v, low) { return `<div class="bar${v < low ? " low" : ""}"><i style="width:${Math.max(0, Math.min(100, v))}%"></i></div>`; }
function renderSide(sl) {
  const R = S.rules, stars = Sim.stars(st, D);
  let h = haveScenes() ? "" : `<div class="note">还没有场景底图：先在漫画版主页（index.html）的「美术预制」里生成，用同一个 Chrome 打开本页就会显示。</div>`;
  h += `<div class="clock">第 ${st.day} 天 · ${esc(sl.label)} <span class="muted">${esc(sl.hours)} · 第 ${st.round + 1}/${sl.rounds} 回合</span></div>`;
  h += `<div>${esc(ROLE[st.role])}，在 <b>${esc(placeName(st.place, st.sub))}</b>${st.fired ? ` <span class="chip bad">已被解雇</span>` : ""}${st.ended ? ` <span class="chip bad">结局：${esc(st.ended)}</span>` : ""}</div>`;
  h += `<div class="stats" style="margin-top:8px">
    <div>钱 <b>$${st.money.toFixed(2)}</b></div><div>名气 <b>${st.fame}</b></div><div>嫌疑 <b>${"★".repeat(stars)}${"☆".repeat(R.max_stars - stars)}</b> <span class="muted">${st.heat}</span></div>
    <div>体力 ${Math.round(st.energy)}${bar(st.energy, R.low_energy)}</div><div>心情 ${Math.round(st.mood)}${bar(st.mood, R.low_mood)}</div><div>社交 ${Math.round(st.social)}${bar(st.social, R.low_social)}</div></div>`;
  Sim.planNow(st, D);
  h += `<h3>今天的打算</h3>${planChips()}`;
  h += `<h3>技能</h3><div>${Object.entries(st.skills).map(([k, v]) => `${esc(S.skills[k] || k)} ${v}`).join(" · ")}</div>`;
  h += `<h3>性格</h3><div>${Object.entries(st.traits).map(([k, v]) => `${esc(S.traits[k])} ${Math.round(v * 100)}`).join(" · ")}</div>`;
  h += `<h3>任务</h3><ul class="plain">`;
  for (const def of D.quests) {
    const q = st.quests[def.id]; if (!q) continue;
    h += `<li><b class="q ${q.status === "done" ? "done" : ""}">${def.type === "main" ? "【主线】" : ""}${esc(def.title)}</b>${q.status === "failed" ? ` <span class="chip bad">失败</span>` : ""}<ul class="plain" style="padding-left:12px">` +
      def.objectives.map(o => `<li class="q ${q.done[o.id] ? "done" : ""}">${q.done[o.id] ? "✓" : "○"} ${esc(o.label)}</li>`).join("") + `</ul></li>`;
  }
  h += `</ul>`;
  h += `<h3>线索 / 物品</h3><div>${[...new Set([...st.clues, ...st.items])].map(x => `<span class="chip">${esc(label(x))}</span>`).join("") || `<span class="muted">还没有</span>`}</div>`;
  h += `<h3>人物此刻</h3><table>`;
  for (const id of Object.keys(S.npcs)) {
    const p = Sim.npcPlace(st, D, id), r = st.rel[id];
    h += `<tr><td>${esc(D.names[id] || id)}</td><td>${p ? esc(D.world_places[p] || p) : `<span class="muted">不知去向</span>`}${p === st.place ? " 👈" : ""}</td><td class="muted">好感 ${r.a} · 信任 ${r.t}</td></tr>`;
  }
  h += `</table>`;
  const hints = Story.hints(st, D).sort((a, b) => b.weight - a.weight).slice(0, 4);
  if (hints.length) h += `<h3>任务在牵引她去</h3><ul class="plain">${hints.map(x => `<li class="muted">${esc([x.place && D.world_places[x.place], x.sub, x.target && D.names[x.target], x.action && (S.actions[x.action] || {}).label].filter(Boolean).join(" · "))} <b>${Math.round(x.weight)}</b></li>`).join("")}</ul>`;
  if (st.lastScores) h += `<h3>她上一步在想</h3><div class="scores">${st.lastScores.map(x => `${esc(x.label)} ${x.s}`).join("<br>")}</div>`;
  const pa = st.prefs.actions, tot = Object.values(pa).reduce((a, b) => a + b, 0);
  if (tot) h += `<h3>像你（接管时的习惯）</h3><div class="muted">${Object.entries(pa).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `${esc(k.startsWith("go:") ? "去" + (D.world_places[k.slice(3)] || k) : ((S.actions[k] || {}).label || k).replace("{sub}", "小地点"))} ${v}`).join(" · ")}</div>`;
  $("side").innerHTML = h;
}

// ---------- 批量统计 ----------
$("batch").onclick = () => {
  const N = Math.max(1, Math.min(500, +$("bn").value || 30)), days = Math.max(1, Math.min(14, +$("bd").value || 7));
  let html = `<table><tr><th>身份</th><th>钱</th><th>线索</th><th>完成任务</th><th>缺勤</th><th>被解雇</th><th>嫌疑</th><th>每天移动</th><th>每天卡</th></tr>`;
  const hitsAll = {};
  for (const role of Object.keys(ROLE)) {
    const a = {money: 0, clues: 0, done: 0, missed: 0, fired: 0, heat: 0, moves: 0, cards: 0};
    for (let seed = 1; seed <= N; seed++) {
      const g = Sim.newGame(D, {seed, role});
      let guard = 0;
      while (!g.ended && g.day <= days && guard++ < 6000) Sim.auto(g, D);
      a.money += g.money; a.clues += g.clues.length; a.missed += g.missed; a.fired += g.fired ? 1 : 0; a.heat += g.heat;
      a.done += Object.values(g.quests).filter(q => q.status === "done").length;
      for (const e of g.log) { if (e.kind === "move") a.moves++; if (e.kind === "card") { a.cards++; (hitsAll[e.card] = hitsAll[e.card] || {})[role] = ((hitsAll[e.card] || {})[role] || 0) + 1; } }
    }
    const f = v => (Math.round(v / N * 100) / 100);
    html += `<tr><td>${ROLE[role]}</td><td>$${f(a.money)}</td><td>${f(a.clues)}</td><td>${f(a.done)}</td><td>${f(a.missed)}</td><td>${Math.round(a.fired / N * 100)}%</td><td>${f(a.heat)}</td><td>${f(a.moves / days)}</td><td>${f(a.cards / days)}</td></tr>`;
  }
  html += `</table><h3>故事卡触发（${N} 局里触发的局数比例；可能一局触发多次）</h3><table><tr><th>卡</th>${Object.values(ROLE).map(r => `<th>${r}</th>`).join("")}</tr>`;
  for (const c of D.cards) {
    const h = hitsAll[c.id] || {};
    html += `<tr><td>${esc(c.title)} <span class="muted">${esc(c.id)}</span></td>${Object.keys(ROLE).map(r => `<td>${h[r] ? Math.round(h[r] / N * 100) + "%" : `<span class="muted">—</span>`}</td>`).join("")}</tr>`;
  }
  $("bout").innerHTML = html + `</table>`;
};

Promise.all([loadScenes(), Art.init(), SimFuse.init()]).then(async () => {
  $("artEngine").value = Art.cfg.engine; $("artAuto").value = Art.cfg.auto;
  if (!load()) newGame();
  else { if (!st.gid) { st.gid = Date.now().toString(36); st.imgs = {}; } st.artSeen = st.seq; await Art.loadGame(st); render(); }
});
})();
</script>
